[package]
name = "frame"
version = "0.1.0"
edition = "2024"
description = "A resizable desktop photo frame that shows random photos and lets you trash or move them with one click"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
rand = "0.9"
rfd = "0.17.2"
trash = "5.2.9"
walkdir = "2.5.0"
