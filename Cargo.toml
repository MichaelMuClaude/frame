[package]
name = "frame"
version = "0.1.0"
edition = "2024"
description = "A resizable desktop photo frame that shows random photos and lets you trash or move them with one click"
license = "MIT"
readme = "README.md"

[features]
default = ["heic"]
# iPhone HEIC/HEIF photos; needs the libheif library at build and run time.
heic = ["dep:libheif-rs"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"], optional = true }
rand = "0.9"
rfd = "0.17.2"
trash = "5.2.9"
walkdir = "2.5.0"

# Windows draws with Direct3D (through wgpu), see main().
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu"] }
# "Show in folder" (SHOpenFolderAndSelectItems) and keeping the window at the bottom (SetWindowPos).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
